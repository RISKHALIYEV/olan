function toast(m){const e=$('#tt');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000)}
let tab='h',sub='s',ar='ph',dt=iso(),opn=0,ip=null;
const tOn=x=>S.T.filter(t=>t.rp||t.d==x),isD=(t,x)=>!!(t.dn&&t.dn[x]),hD=x=>HB.filter(h=>(S.H[x]||{})[h[0]]).length;
const score=x=>{const a=tOn(x),n=a.length+HB.length;return(a.filter(t=>isD(t,x)).length+hD(x))/n};
const lastN=n=>[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return iso(d)});
const chDay=()=>{const t=new Date();return t<new Date(2026,10,1)?1:t>new Date(2026,11,1)?30:t.getDate()};
const streak=id=>{let n=0;const d=new Date();for(let i=0;i<400;i++){const k=iso(d);if((S.H[k]||{})[id])n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n};
const bars=(v,l)=>`<div class="bs">${v.map((x,i)=>`<div><i style="height:${Math.round(Math.min(1,x)*100)}%"></i><small>${l[i]}</small></div>`).join('')}</div>`;
const dl3=x=>WN[new Date(x+'T00:00').getDay()].slice(0,3);
