<style>
:root{--bg:#1d2733;--s:#26323f;--s2:#32424f;--tx:#eae6dc;--mut:#9fb0bf;--warm:#ffc86b;--cool:#7fb0c9;--ok:#8fcf9b;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main,header{max-width:480px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:6px}
header svg{width:40px;height:40px;flex:none}
header b{display:block;font:600 17px Georgia,"Iowan Old Style",serif}
header small{color:var(--mut)}
h2{font:600 20px Georgia,"Iowan Old Style",serif;margin:18px 0 8px}
.hero{position:relative;overflow:hidden;background:var(--s);border-radius:20px;padding:18px;margin-top:10px}
.hero:before{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,200,107,.35),transparent 65%)}
.hero .n{font:700 64px/1 Georgia,serif;color:var(--warm)}
.hero p{position:relative}
.card{background:var(--s);border-radius:14px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cool),var(--warm));width:0}
label.ck{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--s2);min-height:48px}
label.ck:last-child{border:0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--warm);flex:none}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--s2);border:0;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--warm);color:#2a1f08;font-weight:600}
input,select,textarea{background:var(--s2);border:1px solid transparent;border-radius:10px;padding:10px;width:100%;min-height:44px}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid button{aspect-ratio:1;padding:0;font-weight:600}
.grid .t{outline:2px solid var(--cool)}
.stp{display:flex;align-items:center;gap:10px}
.stp b{min-width:64px;text-align:center;font-size:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:#16202a;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--s2)}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;background:none;border-radius:0;color:var(--mut);min-height:60px;font-size:13px}
nav button[aria-current=true]{color:var(--warm);box-shadow:inset 0 3px 0 var(--warm)}
.in{color:var(--ok)}.out{color:#f0a08c}
#tt{display:none;position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:456px;margin:auto;background:var(--warm);color:#2a1f08;padding:12px 14px;border-radius:12px;font-weight:600;z-index:9}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<header>
<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1d2733"/><polygon points="20,32 44,32 54,56 10,56" fill="#ffc86b" opacity=".28"/><path d="M32 8v8" stroke="#eae6dc" stroke-width="2"/><path d="M20 30a12 16 0 0 1 24 0z" fill="#ffc86b"/><path d="M8 56h48" stroke="#7fb0c9" stroke-width="2"/></svg>
<div><b>RISKHALIYEVdesign</b><small>Noyabr 2026 · 30 kunlik reja</small></div>
</header>
<main id="v"></main>
<div id="tt" role="status"></div>
<nav><div id="nv"></div></nav>
<script>
const $=s=>document.querySelector(s),K='rd26';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=JSON.parse(localStorage.getItem(K)||'null')||{c:{},g:{},f:[],r:{},m:0,on:0,t:['04:45','16:30','20:00'],fired:{}};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const D0=new Date(2026,10,1),WN=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const today=()=>Math.min(30,Math.max(1,Math.floor((new Date().setHours(0,0,0,0)-D0)/864e5)+1));
let cur=today(),tab='b';
const wd=d=>new Date(2026,10,d).getDay();
const P=[[`Boshlang'ich holat: telefon vaqti, xarajat daftari, reja`,0],[`Lighting #1: 3 nuqtali yoritish`,10],[`Fiverr gig auditi: sarlavha, tavsif, rasmlar`,0],[`Lighting #2: HDRI bilan kunduzgi yorug'lik`,10],[`Portfolio uchun 5 ta eng yaxshi render`,0],[`Instagram sahifa ochish va 1-post`,10],[`Lighting #3: oldin/keyin taqqoslash`,0],
[`Haftalik tahlil, post matnlari`,0],[`Lighting #4: deraza yorug'ligi`,15],[`Gig tavsifini inglizcha yaxshilash`,15],[`Lighting #5: kechki iliq yorug'lik`,0],[`Instagram: 2 post`,15],[`Gig muqovasi: 3 variant`,0],[`Lighting #6: LED va lampalar`,15],
[`Haftalik tahlil`,0],[`Lighting #7: quyosh va osmon`,20],[`Gigga 3 ta yangi render`,20],[`Lighting #8: soyalar va kontrast`,0],[`Instagram: 2 post`,20],[`Mijozga inglizcha xabar shablonlari`,20],[`Lighting #9 va 1 post`,0],
[`Oy o'rtasi tahlili`,0],[`Lighting #10: materiallar va yorug'lik`,20],[`Gigni yangi renderlar bilan yangilash`,20],[`Lighting #11`,20],[`Instagram: 2 post, bio'ga Fiverr havolasi`,20],[`Portfolio: yakuniy 5 render`,20],[`Lighting #12: yakuniy sahna`,0],[`Oy natijalarini yig'ish`,0],[`Oylik tahlil va dekabr rejasi`,20]];
const CK=[['w','Suv va gigiyena',1],['s','Mashq (rejadagi kunda)',1],['e',`10 daqiqa inglizcha so'z`,1],['k','Asosiy blok (1 soat)',0],['o','Ovqat: kamida 2 mahal (3-haftadan 3 mahal)',0],['b','Kitob 10 daqiqa',1],['p','Telefon limiti oshmadi',0],['x','Xarajat yozildi',0],['y','21:30 gacha yotish',1]];
const G=[['l','Lighting mashqlari',12],['i','Instagram postlar',8],['m','Uy mashqlari',15],['z',`Yangi so'zlar`,150]];
const done=d=>Object.values(S.c[d]||{}).filter(Boolean).length;
const slot=w=>w==0?`15:30 · 30 daqiqa haftalik tahlil`:w%2?`18:30–19:30`:`16:30–17:30`;
function streak(){let n=0;for(let d=today();d>=1;d--){if(done(d)>=5)n++;else if(d!==today())break}return n}
function V(){
 const h=[],d=cur,w=wd(d),[task,sp]=P[d-1];
 if(tab=='b'){
  const items=CK.filter(x=>!S.m||x[2]),n=items.filter(x=>(S.c[d]||{})[x[0]]).length;
  h.push(`<div class="hero"><div class="row"><span class="mut">${WN[w]}, ${d}-noyabr</span><span class="mut">Seriya: ${streak()} kun</span></div><div class="n">${d}</div><p><b>${esc(task)}</b></p><p class="mut">Asosiy blok: ${slot(w)}${w==0?` (yengil kun)`:''}</p></div>
  <div class="card mut">${sp?`Mashq: ${sp} daqiqa. `:`Bugun mashq rejada yo'q. `}${[2,4,6].includes(w)?`Fan mashg'uloti 15:00 da, 20 daqiqa. `:''}Kechqurun 20:00 dan keyin telefon uzoqda.</div>
  <div class="row"><h2>Kunlik baho</h2><button id="mn">${S.m?'Oddiy kun':'Minimal kun'}</button></div>
  <div class="bar"><i style="width:${n/items.length*100}%"></i></div><p class="mut">${n} / ${items.length}${n>=5?` · yaxshi kun`:''}</p>
  <div class="card">${items.map(x=>`<label class="ck"><input type="checkbox" data-k="${x[0]}" ${(S.c[d]||{})[x[0]]?'checked':''}>${x[1]}</label>`).join('')}</div>
  <div class="row"><button id="pv">Oldingi kun</button><button id="nx">Keyingi kun</button></div>`);
 }
 if(tab=='r'){
  h.push(`<h2>30 kun</h2><p class="mut">Rang to'laroq bo'lsa, ko'proq bajarilgan. Kunni bosib oching.</p><div class="grid">${P.map((_,i)=>{const d=i+1,a=done(d)/9;return `<button data-d="${d}" class="${d==today()?'t':''}" style="background:rgba(255,200,107,${.1+a*.8});color:${a>.5?'#2a1f08':'var(--tx)'}" aria-label="${d}-noyabr">${d}</button>`}).join('')}</div>
  <h2>Hafta tartibi</h2><div class="card mut">Dush, chor, jum: darsdan keyin 18:30–19:30 blok.<br>Sesh, pay, shan: 16:30–17:30 blok va 15:00 da fan.<br>Yakshanba: yengil kun, faqat tahlil.<br>Yotish 21:00–21:30, turish 4:30–5:00.</div>`);
 }
 if(tab=='g'){
  h.push(`<h2>Maqsadlar</h2>`+G.map(g=>{const v=S.g[g[0]]||0;return `<div class="card"><div class="row"><span>${g[1]}</span><span class="stp"><button data-g="${g[0]}" data-s="-1" aria-label="kamaytirish">−</button><b>${v}/${g[2]}</b><button data-g="${g[0]}" data-s="1" aria-label="oshirish">+</button></span></div><div class="bar"><i style="width:${Math.min(100,v/g[2]*100)}%"></i></div></div>`}).join('')+`
  <h2>Haftalik tahlil</h2><div class="card mut">1. Eng yaxshi nima bo'ldi? 2. Nima o'rgandim? 3. Nima halaqit berdi? 4. Telefon o'rtacha necha soat? 5. Keyingi haftada bitta o'zgarish? 6. Pulni oqilona sarfladimmi?</div>
  <textarea id="rv" rows="6" placeholder="${Math.ceil(d/7)}-hafta javoblari">${esc(S.r[Math.ceil(d/7)]||'')}</textarea>`);
 }
 if(tab=='f'){
  const k=S.f.filter(x=>x.t=='k').reduce((a,x)=>a+x.a,0),c=S.f.filter(x=>x.t=='c').reduce((a,x)=>a+x.a,0);
  h.push(`<h2>Pul</h2><div class="card"><div class="row"><span>Kirim</span><b class="in">${k.toLocaleString('ru')}</b></div><div class="row"><span>Chiqim</span><b class="out">${c.toLocaleString('ru')}</b></div><div class="row"><span>Jamg'arma uchun 10%</span><b>${Math.round(k*.1).toLocaleString('ru')}</b></div></div>
  <div class="card"><select id="ft"><option value="c">Chiqim</option><option value="k">Kirim</option></select><br><br><input id="fa" type="number" inputmode="numeric" placeholder="Summa (so'm)"><br><br><input id="fn" placeholder="Nima uchun? (zarur yoki xohish)"><br><br><button class="p" id="fs">Qo'shish</button></div>
  ${S.f.slice(-12).reverse().map(x=>`<div class="card row"><span>${esc(x.n||'')}<br><small class="mut">${x.d}-noyabr</small></span><b class="${x.t=='k'?'in':'out'}">${x.t=='k'?'+':'−'}${x.a.toLocaleString('ru')}</b></div>`).join('')}`);
 }
 if(tab=='s'){
  const ok='Notification' in window;
  h.push(`<h2>Eslatmalar</h2><div class="card"><p class="mut">Bildirishnoma ilova ochiq yoki fonda jonli bo'lsa ishlaydi. Yopiq holatda ishonchli eslatma uchun telefon kalendariga qo'shing.</p><br>
  <label class="ck"><input type="checkbox" id="on" ${S.on?'checked':''}>Bildirishnomalarni yoqish</label>
  ${S.t.map((t,i)=>`<div class="row"><span>${['Ertalab','Asosiy blok','Kechki baho'][i]}</span><input type="time" data-t="${i}" value="${t}" style="width:130px"></div><br>`).join('')}
  <button class="p" id="ics">Kalendarga qo'shish (.ics)</button> <button id="tn">Sinash</button></div>
  <h2>Ma'lumot</h2><div class="card"><p class="mut">Hammasi shu qurilmada saqlanadi.</p><br><button id="ex">Zaxira nusxa</button> <button id="im">Tiklash</button> <button id="rs">Tozalash</button><input type="file" id="fi" accept=".json" hidden></div>`);
 }
 $('#v').innerHTML=h.join('');
 $('#nv').innerHTML=[['b','Bugun'],['r','Reja'],['g','Maqsad'],['f','Pul'],['s','Sozlama']].map(x=>`<button data-tab="${x[0]}" ${tab==x[0]?'aria-current="true"':''}>${x[1]}</button>`).join('');
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;V();scrollTo(0,0)}
 else if(t.dataset.d){cur=+t.dataset.d;tab='b';V();scrollTo(0,0)}
 else if(t.dataset.g){const k=t.dataset.g;S.g[k]=Math.max(0,(S.g[k]||0)+ +t.dataset.s);save();V()}
 else if(t.id=='mn'){S.m=S.m?0:1;save();V()}
 else if(t.id=='pv'){cur=Math.max(1,cur-1);V();scrollTo(0,0)}
 else if(t.id=='nx'){cur=Math.min(30,cur+1);V();scrollTo(0,0)}
 else if(t.id=='fs'){const a=+$('#fa').value;if(a>0){S.f.push({t:$('#ft').value,a,n:$('#fn').value,d:today()});save();V()}}
 else if(t.id=='ics')ics();
 else if(t.id=='tn')notify('Sinov','Bildirishnoma ishlayapti.');
 else if(t.id=='ex'){dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'noyabr26-zaxira.json')}
 else if(t.id=='im')$('#fi').click();
 else if(t.id=='rs'&&confirm(`Hamma ma'lumot o'chiriladi. Davom etasizmi?`)){localStorage.removeItem(K);location.reload()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.k){(S.c[cur]=S.c[cur]||{})[t.dataset.k]=t.checked;save();V()}
 else if(t.id=='on'){if(t.checked){perm().then(ok=>{S.on=ok?1:0;save();V()})}else{S.on=0;save()}}
 else if(t.dataset.t){S.t[+t.dataset.t]=t.value;save()}
 else if(t.id=='fi'){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();V()}catch(_){alert(`Fayl noto'g'ri`)}};r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{if(e.target.id=='rv'){S.r[Math.ceil(cur/7)]=e.target.value;save()}});
